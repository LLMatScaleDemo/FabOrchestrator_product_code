<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FabOrchestrator.ai — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Instrument Sans', sans-serif;
    background: #E8E4F0;
    background-image: radial-gradient(ellipse at 30% 20%, #DDD8EE 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 80%, #D8E8EE 0%, transparent 55%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 2px 40px rgba(0,0,0,0.07);
    width: 100%;
    max-width: 440px;
    padding: 52px 48px 44px;
    animation: up 0.5s ease both;
  }

  @keyframes up {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Logo */
  .logo {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 36px;
  }

  .logo-mark {
    width: 32px; height: 32px;
    background: #1A1A2E;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }

  .logo-name {
    font-family: 'Instrument Sans', sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: #1A1A2E;
    letter-spacing: -0.01em;
  }

  .logo-name span { color: #FF6B4A; }

  /* Heading */
  .heading {
    font-family: 'Instrument Serif', serif;
    font-size: 28px;
    color: #1A1A2E;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }

  .sub {
    font-size: 14px;
    color: #9796A1;
    margin-bottom: 32px;
  }

  /* Field */
  .field { margin-bottom: 16px; }

  label {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    color: #4A4A5A;
    margin-bottom: 6px;
    letter-spacing: 0.01em;
  }

  .input-wrap { position: relative; }

  input[type="email"],
  input[type="password"],
  input[type="text"] {
    width: 100%;
    padding: 11px 14px;
    background: #F9F8F6;
    border: 1.5px solid #ECEAE5;
    border-radius: 10px;
    font-family: 'Instrument Sans', sans-serif;
    font-size: 14px;
    color: #1A1A2E;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input::placeholder { color: #C4C3CC; }

  input:focus {
    border-color: #FF6B4A;
    box-shadow: 0 0 0 3px rgba(255,107,74,0.1);
    background: #fff;
  }

  .pw-toggle {
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    color: #C4C3CC; cursor: pointer;
    display: flex; align-items: center;
    padding: 2px;
    transition: color 0.15s;
  }
  .pw-toggle:hover { color: #9796A1; }

  /* Row */
  .row {
    display: flex; align-items: center;
    justify-content: space-between;
    margin: 20px 0 24px;
  }

  .check-label {
    display: flex; align-items: center; gap: 7px;
    font-size: 13px; color: #9796A1; cursor: pointer;
  }

  input[type="checkbox"] {
    width: 14px; height: 14px;
    accent-color: #FF6B4A;
    cursor: pointer;
  }

  .forgot {
    font-size: 13px;
    color: #FF6B4A;
    text-decoration: none;
    font-weight: 500;
  }
  .forgot:hover { text-decoration: underline; }

  /* Button */
  .btn {
    width: 100%;
    padding: 13px;
    background: #1A1A2E;
    border: none;
    border-radius: 10px;
    color: #fff;
    font-family: 'Instrument Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.12s;
    margin-bottom: 16px;
    letter-spacing: 0.01em;
  }

  .btn:hover { background: #2E2E48; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }

  /* Divider */
  .divider {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 14px;
  }
  .div-line { flex: 1; height: 1px; background: #ECEAE5; }
  .div-text { font-size: 12px; color: #C4C3CC; }

  /* SSO */
  .sso {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; margin-bottom: 28px;
  }

  .btn-sso {
    padding: 10px;
    background: #F9F8F6;
    border: 1.5px solid #ECEAE5;
    border-radius: 10px;
    font-family: 'Instrument Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #1A1A2E;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: border-color 0.15s;
  }
  .btn-sso:hover { border-color: #C4C3CC; }

  /* Sign up */
  .signup {
    text-align: center;
    font-size: 13px;
    color: #9796A1;
  }
  .signup a { color: #FF6B4A; font-weight: 500; text-decoration: none; }
  .signup a:hover { text-decoration: underline; }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 32px;
    font-size: 11px;
    color: #C4C3CC;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-mark">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
        <path d="M10 2L18 6.5V13.5L10 18L2 13.5V6.5L10 2Z" fill="white" opacity="0.95"/>
      </svg>
    </div>
    <span class="logo-name">FabOrchestrator<span>.ai</span></span>
  </div>

  <h1 class="heading">Welcome back</h1>
  <p class="sub">Sign in to your account to continue.</p>

  <div class="field">
    <label for="email">Email address</label>
    <input type="email" id="email" placeholder="name@company.com" autocomplete="email">
  </div>

  <div class="field">
    <label for="password">Password</label>
    <div class="input-wrap">
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      <button class="pw-toggle" onclick="togglePw()" aria-label="Toggle password">
        <svg id="eyeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="row">
    <label class="check-label">
      <input type="checkbox"> Remember me
    </label>
    <a href="#" class="forgot">Forgot password?</a>
  </div>

  <button class="btn" onclick="handleLogin(this)">Sign in</button>

  <div class="divider">
    <div class="div-line"></div>
    <span class="div-text">or</span>
    <div class="div-line"></div>
  </div>

  <div class="sso">
    <button class="btn-sso">
      <svg width="15" height="15" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Google
    </button>
    <button class="btn-sso">
      <svg width="15" height="15" viewBox="0 0 21 21" fill="none"><rect width="10" height="10" fill="#F25022"/><rect x="11" width="10" height="10" fill="#7FBA00"/><rect y="11" width="10" height="10" fill="#00A4EF"/><rect x="11" y="11" width="10" height="10" fill="#FFB900"/></svg>
      Microsoft
    </button>
  </div>

  <div class="signup">
    Don't have an account? <a href="#">Request access</a>
  </div>

  <div class="footer">© 2026 LLM at Scale.AI · All Rights Reserved</div>
</div>

<script>
  function togglePw() {
    const pw = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (pw.type === 'password') {
      pw.type = 'text';
      icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>`;
    } else {
      pw.type = 'password';
      icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    }
  }

  function handleLogin(btn) {
    btn.textContent = 'Signing in…';
    btn.style.opacity = '0.7';
    setTimeout(() => {
      btn.textContent = 'Sign in';
      btn.style.opacity = '1';
    }, 1800);
  }
</script>
</body>
</html>
