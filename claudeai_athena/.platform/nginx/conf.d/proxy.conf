# Master-data .xlsx uploads are several MB; nginx defaults to 1 MB and returns
# 413 before the request reaches the app (POST /api/cmf/packages/stage). Raise it.
client_max_body_size 50m;
proxy_read_timeout 600;
proxy_send_timeout 600;
proxy_connect_timeout 60;
proxy_buffering off;
proxy_http_version 1.1;
proxy_set_header Connection "";
